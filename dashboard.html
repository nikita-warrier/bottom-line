<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="">Branding</a>
        <a href="">Influencers</a>

    </div>
    <h1>Welcome to bottom line</h1>

    <div class="page-shell">
        <div class="timeline">
            <div class="timeline-header">
                <h2>Timeline</h2>

            </div>

            <form id="timeline-form" class="timeline-form">
                <label>
                    <span>Date</span>
                    <input type="date" id="timeline-date" required>
                </label>
                <label>
                    <span>Event</span>
                    <input type="text" id="timeline-event" placeholder="Add a milestone" required>
                </label>
                <button type="submit">Add event</button>
            </form>

            <div class="timeline-list-wrap">
                <ul id="timeline-list" class="timeline-list"></ul>
                <button id="timeline-toggle" class="timeline-toggle" type="button" hidden>See more</button>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-preview-boxes branding-card">
                <h3>Branding</h3>
                <div class="container">
                    <label class="branding-avatar " for="branding-image-input">
                        <span class="branding-avatar__image" id="branding-avatar-image"></span>
                        <span class="branding-avatar__label">Click to add image</span>
                    </label>
                    <input type="file" id="branding-image-input" accept="image/*" hidden>
                </div>
            </div>

            <div class="dashboard-preview-boxes influencer-card">
                <div class="influencer-header">
                    <h3>Social Media</h3>
                    <button type="button" class="add-platform-btn" id="add-platform-btn">Add more</button>
                </div>
                <div id="platform-grid" class="platform-grid" aria-label="Social media platforms"></div>
            </div>

            <div class="dashboard-preview-boxes checklist-card">
                <div class="checklist-header">
                    <h3 >Checklist</h3>
                    <span id="checklist-count" class="checklist-badge">0 items</span>
                </div>

                <form id="checklist-form" class="checklist-form">
                    <input type="text" id="checklist-input" maxlength="120" required>
                    <button type="submit">Add item</button>
                </form>

                

                <ul id="checklist-list" class="checklist-list" aria-label="Checklist items"></ul>
            </div>

            <div class="dashboard-preview-boxes">__________</div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
